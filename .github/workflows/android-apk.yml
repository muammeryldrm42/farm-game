# A test APK of the Android app, built by GitHub when started by hand from the Actions tab (Run
# workflow; the game is tried in Android Studio, so pushes no longer start it): kept with the
# run, and put on the release page "android-test" at a fixed address,
# https://github.com/muammeryldrm42/farm-game/releases/download/android-test/talons-farm.apk
# It is the debug build (signed with a throwaway debug key): for trying on a phone, not for Google
# Play, which takes the signed release bundle made in Android Studio (see README.md).
# Then the APK is installed on an Android emulator and the game opened: screenshots as it starts
# and the app's log are kept with the run and put on the same release page (android-screen-*.png,
# android-log.txt, android-status.txt), to see the app itself as a phone shows it.
name: Android test APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # the runner has the Android SDK; the Android 16 parts the project needs are added if missing
      - name: Android SDK parts
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Name it
        run: cp android/app/build/outputs/apk/debug/app-debug.apk talons-farm.apk

      - uses: actions/upload-artifact@v4
        with:
          name: talons-farm-apk
          path: talons-farm.apk

      # The new APK takes the old one's place on the page, which is made only when it is not there:
      # deleting the page first left no APK at the address when GitHub then failed to make the new
      # one (an HTTP 502). A page left as a draft (gh makes one, adds the APK, then publishes it,
      # and the 502 came before the publishing) is published here too. Tried three times, as
      # GitHub's own errors come and go; the step fails if the page is not out with the APK.
      - name: Put it on the release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: "Test build of the Android app (debug, not for Google Play). On the phone: open the link, download, allow installing from this source, install. Built from ${{ github.sha }}."
        run: |
          for try in 1 2 3; do
            if gh release view android-test > /dev/null 2>&1; then
              gh release upload android-test talons-farm.apk --clobber \
                && gh release edit android-test --draft=false --prerelease --target "$GITHUB_SHA" --notes "$NOTES" && break
            else
              gh release create android-test talons-farm.apk --target "$GITHUB_SHA" --prerelease \
                --title "Talons Farm: Android test APK" --notes "$NOTES" && break
            fi
            sleep 30
          done
          gh release view android-test --json isDraft,assets --jq 'select(.isDraft == false) | .assets[].name' | grep -qx talons-farm.apk

  screens:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: talons-farm-apk

      # the emulator runs fast only with the processor's virtualisation, which the runner has
      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the game on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          # (a fresh emulator's Google Play services spend their first minute updating and
          # restarting: the game is opened after that, as on a phone in use; android-status.txt
          # says at each picture whether the game was still running)
          script: |
            adb install -r talons-farm.apk
            sleep 60
            adb logcat -c
            adb shell am start -n com.talons.farm/.MainActivity
            sleep 45
            adb exec-out screencap -p > android-screen-1.png
            (adb shell pidof com.talons.farm > /dev/null && echo "45 s: running" || echo "45 s: NOT RUNNING") >> android-status.txt
            sleep 60
            adb exec-out screencap -p > android-screen-2.png
            (adb shell pidof com.talons.farm > /dev/null && echo "105 s: running" || echo "105 s: NOT RUNNING") >> android-status.txt
            sleep 60
            adb exec-out screencap -p > android-screen-3.png
            (adb shell pidof com.talons.farm > /dev/null && echo "165 s: running" || echo "165 s: NOT RUNNING") >> android-status.txt
            adb shell dumpsys window displays | grep -m 3 -i "cur=\|rotation" >> android-status.txt || true
            adb logcat -d > android-log.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screens
          path: |
            android-screen-*.png
            android-log.txt
            android-status.txt

      - name: Put them on the release page
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload android-test android-screen-*.png android-log.txt android-status.txt --clobber --repo "$GITHUB_REPOSITORY" || true
